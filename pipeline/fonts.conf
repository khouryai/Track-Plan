<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- The plot names Arial / Swiss 721 without embedding them.  Map them to
     Liberation Sans, which is metric-identical to Arial (and Helvetica, of
     which Swiss 721 is a clone), so text sits exactly where AutoCAD put it. -->
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <test name="family" compare="contains"><string>Black</string></test>
    <edit name="weight" mode="assign"><const>black</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Bold</string></test>
    <edit name="weight" mode="assign"><const>bold</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Italic</string></test>
    <edit name="slant" mode="assign"><const>italic</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Swiss721</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Liberation Sans</string></edit>
  </match>
</fontconfig>
